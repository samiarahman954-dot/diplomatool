name: Build SwiftGet for Windows

on:
  push:
    paths:
      - "download-manager/**"
      - ".github/workflows/swiftget-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: download-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build SwiftGet.exe
        run: pyinstaller --noconfirm --onefile --windowed --name SwiftGet --icon assets/swiftget.ico --add-data "assets/swiftget.ico;assets" run.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SwiftGet.exe package/
          Copy-Item -Recurse browser-extension package/browser-extension
          Copy-Item README.md package/

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftGet-windows
          path: download-manager/package
