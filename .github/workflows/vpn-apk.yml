name: Build VPN APK

on:
  push:
    paths:
      - "vpn-android/**"
      - ".github/workflows/vpn-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpn-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SecureVPN.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SecureVPN-apk
          path: vpn-android/SecureVPN.apk

      - name: Publish APK to the "vpn-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vpn-latest --yes --cleanup-tag || true
          gh release create vpn-latest SecureVPN.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Secure VPN APK (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download SecureVPN.apk and install it on Android 7.0+."
