name: Build Snake game

on:
  push:
    paths: ["snake-game/**", ".github/workflows/snake-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 nsis
      - run: ./snake-game/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snake-windows
          path: |
            snake-game/dist/Snake.exe
            snake-game/dist/Snake-Setup.exe
